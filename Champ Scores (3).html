return `<div class="yr${y===cur?' on':''}"><button class="top${tg?' gold':''}" data-y="${y}" data-t="${t.i}"><span><b>${y}: ${nm(t.r[0])}</b><small>${sd(t.r[0])?'No. '+sd(t.r[0])+' seed':''}${ties?` · ${ties} other${ties>1?'s':''} tied`:''}</small></span><span class="num">${t.s}</span></button><button class="ch" data-y="${y}" data-c="1"><span>🏆 Champion: ${nm(c.r[0])}</span><span>#${c.k} · ${c.s} pts</span></button></div>`}).join('');
document.querySelectorAll('#champ button').forEach(b=>b.onclick=()=>go(b.dataset.y,b.dataset.c?'.r.gold':'.r'));
const R=all[cur];let pos=1,neg=1;
Object.values(all).forEach(A=>A.forEach(x=>{pos=Math.max(pos,x.parts.filter(v=>v>0).reduce((a,b)=>a+b,0));neg=Math.max(neg,-x.parts.filter(v=>v<0).reduce((a,b)=>a+b,0))}));
const W=pos+neg,z=neg/W*100,q=$('#q').value.toLowerCase(),lim=+$('#n').value;let o='',shown=0;
for(const x of R){const g=x.r[0]===Y[cur].champ;if(x.k>lim&&!g)continue;if(q&&!x.r[0].toLowerCase().includes(q)&&!g)continue;shown++;let pp=z,nn=z,sg='';
x.parts.forEach((v,j)=>{if(!v)return;const w=Math.abs(v)/W*100,c=K[j];if(v>0){sg+=`<div class="seg" data-i="${x.i}" data-j="${j}" style="left:${pp}%;width:${w}%;background:${c.col}"></div>`;pp+=w}else{nn-=w;sg+=`<div class="seg" data-i="${x.i}" data-j="${j}" style="left:${nn}%;width:${w}%;background:${c.col}"></div>`}});
const mv=dr[cur][x.i]-x.k,mt=mv>0?`<span class="up">▲${mv}</span>`:mv<0?`<span class="dn">▼${-mv}</span>`:'<span style="color:var(--mute)">–</span>';
o+=`<div class="r${g?' gold':''}"><span class="rk num">${x.k}</span><span class="nm">${g?'🏆 ':''}${nm(x.r[0])}${sd(x.r[0])?`<span class="sd">(${sd(x.r[0])})</span>`:''}</span><span class="mv">${mt}</span><div class="trk">${sg}<div class="z" style="left:${z}%"></div></div><span class="sc num">${x.s}</span></div>`}
$('#rows').innerHTML=o||'<div class="note">No team matches that search.</div>';
$('#note').innerHTML=`${cur}: gold marks the actual champion, not the top scorer. Showing ${shown} of ${R.length} teams (the champion is always shown). Parentheses show tournament seed. Change arrows compare each team's rank with the default key. Power conferences: ACC, Big 12, Big Ten, SEC, Big East (plus the Pac-12 in 2023 and 2024). Bar scale is shared across years.`}
draw();
</script></body></html>
